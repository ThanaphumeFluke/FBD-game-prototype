<title>เกมวาด Free-Body Diagram</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f5f9;--card:#fff;--ink:#14213d;--mute:#5b6779;--line:#d5dce6;--W:#2563eb;--N:#15803d;--f:#dc2626;--F:#c2410c;--T:#7e22ce;--U:#0e7490;--ok:#15803d;--bad:#b91c1c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1626;--card:#17233a;--ink:#e8edf6;--mute:#9aa7bd;--line:#2c3b57;--W:#60a5fa;--N:#4ade80;--f:#f87171;--F:#fb923c;--T:#c084fc;--U:#22d3ee;--ok:#4ade80;--bad:#f87171}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans Thai',system-ui,sans-serif;line-height:1.55}
.wrap{max-width:560px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
h1{font-size:1.5rem;margin:6px 0}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--mute);font-size:.9rem}
.lv{padding:2px 10px;border-radius:99px;border:1px solid var(--line);font-weight:600}
.q{font-size:1.05rem;font-weight:600;margin:8px 0}
.tags{display:flex;gap:6px;flex-wrap:wrap;font-size:.85rem;color:var(--mute)}
.tags span{border:1px solid var(--line);border-radius:6px;padding:1px 8px}
svg{width:100%;height:auto;display:block;touch-action:manipulation}
.pal{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pal button{font:inherit;font-weight:600;padding:12px 8px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.pal button.on{color:#fff}
.hint{font-size:.9rem;color:var(--mute);margin:8px 0}
.row{display:flex;gap:8px;margin-top:10px}
.btn{font:inherit;font-weight:800;padding:13px 16px;border-radius:10px;border:0;background:var(--ink);color:var(--bg);cursor:pointer;flex:1}
.btn.alt{background:transparent;color:var(--ink);border:2px solid var(--line);flex:0 0 auto}
button:focus-visible{outline:3px solid var(--W);outline-offset:2px}
.fb{border-left:6px solid var(--bad)}.fb.good{border-left-color:var(--ok)}
.fb ul{padding-left:0;list-style:none;margin:6px 0}
.big{font-size:3rem;font-weight:800;margin:0}
.hide{display:none}
.pal button{touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.ghost{position:fixed;z-index:9;pointer-events:none;transform:translate(-50%,-130%);color:#fff;font-weight:800;padding:10px 14px;border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.3)}
</style>
</head>

 var c=T[type].c,lb=pt(a,112);
 return '<g opacity="'+(dash?0.9:1)+'"><line x1="180" y1="135" x2="'+b[0]+'" y2="'+b[1]+'" stroke="'+c+'" stroke-width="5" '+(dash?'stroke-dasharray="7 5"':'')+'/><polygon points="'+p+' '+bl+' '+br+'" fill="'+c+'"/><text x="'+lb[0]+'" y="'+(lb[1]+5)+'" text-anchor="middle" font-weight="800" font-size="16" fill="'+c+'">'+lab(type)+'</text></g>';
}
function lab(t){return t=="U"?"T₂":(t=="T"&&Q[i].two?"T₁":t)}
function ropes(q){var s="";
 if(q.wall){s+='<rect x="222" y="-5" width="150" height="285" fill="#8b6f47" opacity=".35"/><line x1="222" y1="0" x2="222" y2="270" stroke="var(--ink)" stroke-width="4"/>';
  if(q.fr)for(var y=0;y<270;y+=14)s+='<line x1="222" y1="'+y+'" x2="232" y2="'+(y+8)+'" stroke="#6b5434" stroke-width="2"/>'}
 (q.rp||[]).forEach(function(a,k){var e=pt(a,120),m=pt(a,142);
  s+='<line x1="180" y1="135" x2="'+e[0]+'" y2="'+e[1]+'" stroke="#a16207" stroke-width="5" stroke-linecap="round"/><g transform="translate('+e[0]+' '+e[1]+') rotate('+(-a)+')"><rect x="0" y="-46" width="60" height="92" fill="#8b6f47" opacity=".35"/><line x1="0" y1="-46" x2="0" y2="46" stroke="var(--ink)" stroke-width="4"/><path d="M0 -40l14 10M0 -28l14 10M0 -16l14 10M0 -4l14 10M0 8l14 10M0 20l14 10M0 32l14 10" stroke="#6b5434" stroke-width="2"/></g>';
  if(q.two)s+='<text x="'+m[0]+'" y="'+(m[1]+4)+'" text-anchor="middle" font-size="12" font-weight="600" fill="var(--ink)">เชือก '+(k+1)+'</text>'});
 return s}
function scene(q,show){
 var s='<svg viewBox="0 0 360 270" role="img" aria-label="กล่องและพื้น">'+ropes(q)+'<g transform="rotate('+(q.s=="i"?-30:0)+' 180 135)">';
 if(q.s!="a")s+='<rect x="-120" y="175" width="600" height="60" fill="'+(q.fr?'#8b6f47':'#9bd3ee')+'" opacity=".55"/>';
 if(q.fr&&q.s!="a"){for(var x=-120;x<480;x+=14)s+='<line x1="'+x+'" y1="175" x2="'+(x+8)+'" y2="185" stroke="#6b5434" stroke-width="2"/>'}
 if(q.s!="a")s+='<line x1="-120" y1="175" x2="480" y2="175" stroke="var(--ink)" stroke-width="3"/>';
 s+='<rect x="140" y="95" width="80" height="80" rx="4" fill="var(--card)" stroke="var(--ink)" stroke-width="3"/></g>';
 s+='<circle cx="180" cy="135" r="4" fill="var(--ink)"/>';
 for(var a=0;a<360;a+=30){var d=pt(a,122);var m=pt(a,128),on=false;for(var k in pl)if(pl[k]==a)on=k;
  if(!done)s+='<circle data-a="'+a+'" cx="'+d[0]+'" cy="'+d[1]+'" r="'+(on?0:7)+'" fill="none" stroke="var(--mute)" stroke-width="1.5" opacity=".3" style="cursor:pointer"/><circle data-a="'+a+'" cx="'+d[0]+'" cy="'+d[1]+'" r="20" fill="transparent" style="cursor:pointer"/>'+(on?'<g pointer-events="none"><circle cx="'+m[0]+'" cy="'+m[1]+'" r="7" fill="'+T[on].c+'"/><text x="'+m[0]+'" y="'+(m[1]+3.5)+'" text-anchor="middle" font-size="10" font-weight="800" fill="#fff">✕</text></g>':'');}
 if(show&&view=="key")q.ex.forEach(function(e){s+=arrow(e[0],e[1],false)});
 else for(var k in pl){var bad=show&&!q.ex.some(function(e){return e[0]==k&&e[1]==pl[k]});s+=arrow(k,pl[k],bad)}
 return s+'</svg>';
}
var S={};var view="key";function start(){S={};i=0;score=0;draw()}
function tot(){var s=0;for(var j in S)if(S[j].d)s+=S[j].p;return s}
function draw(){score=tot();
 if(i>=Q.length){var pct=Math.round(score/Q.length*100);
  app.innerHTML='<div class="card" style="text-align:center"><h1>จบเกม</h1><p class="big">'+score.toFixed(1)+' / '+Q.length+'</p><p>ได้ '+pct+'% '+(pct>=80?'เยี่ยมมาก':pct>=50?'ดีแล้ว ลองเล่นอีกรอบเพื่อทบทวนข้อที่พลาด':'ลองอ่านเฉลยแต่ละข้อแล้วเล่นใหม่อีกครั้ง')+'</p><div class="row"><button class="btn alt" id="bk">‹ ย้อนกลับ</button><button class="btn" id="re">เล่นใหม่</button></div></div>';
  document.getElementById("re").onclick=start;document.getElementById("bk").onclick=function(){i=Q.length-1;draw()};return}
 var q=Q[i];if(!S[i])S[i]={pl:{},d:false,p:0};pl=S[i].pl;sel=null;done=false;var was=S[i].d;
 app.innerHTML='<div class="top"><span>ข้อ '+(i+1)+' / '+Q.length+'</span><span class="lv">'+q.lv+'</span><span>คะแนน '+score.toFixed(1)+'</span></div>'+
 '<div class="card"><div class="tags"><span>'+(q.tg||(q.fr?'พื้นมีแรงเสียดทาน':'พื้นลื่น ไม่มีแรงเสียดทาน'))+'</span><span>'+q.st+'</span></div><p class="q">'+q.t+'</p><div id="board"></div>'+
 '<p class="hint" id="hint">ลากปุ่มแรงจากด้านล่างขึ้นไปวางรอบกล่อง ลูกศรจะชี้ไปตามตำแหน่งที่วาง (หรือแตะปุ่มแล้วแตะจุดรอบกล่องก็ได้) แตะวงกลม ✕ เพื่อยกเลิกลูกศร</p>'+
 '<div class="pal" id="pal"></div><div class="row"><button class="btn alt" id="clr">ล้าง</button><button class="btn" id="go">ส่งคำตอบ</button></div></div><div id="res"></div><div class="row" style="justify-content:space-between"><button class="btn alt" id="pv">‹ ย้อนกลับ</button><button class="btn alt" id="nt">ข้ามไป ›</button></div>';
 var pal=document.getElementById("pal");
 Object.keys(T).forEach(function(k){if(k=="U"&&!q.two)return;var b=document.createElement("button");b.textContent=T[k].n;b.dataset.k=k;b.style.borderColor=T[k].c;
  b.onpointerdown=function(e){startDrag(e,k)};b.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){sel=k;upd()}};pal.appendChild(b)});
 document.getElementById("clr").onclick=function(){S[i].pl=pl={};sel=null;upd()};
 document.getElementById("go").onclick=submit;
 var pv=document.getElementById("pv"),nt=document.getElementById("nt");pv.disabled=(i==0);pv.style.opacity=(i==0?0.4:1);
 pv.onclick=function(){if(i>0){i--;draw();window.scrollTo(0,0)}};
 nt.onclick=function(){i++;draw();window.scrollTo(0,0)};
 document.getElementById("board").onclick=function(e){var a=e.target.getAttribute&&e.target.getAttribute("data-a");
  if(a===null||done)return;if(!sel){var rm=null;for(var k in pl)if(pl[k]==+a)rm=k;if(rm){delete pl[rm];upd();document.getElementById("hint").textContent="ยกเลิก "+T[rm].n+" แล้ว"}else document.getElementById("hint").textContent="เลือกชนิดแรงด้านล่างก่อน แล้วค่อยแตะทิศ";return}
  pl[sel]=+a;sel=null;upd()};
 upd();
 if(was)submit();
}
function ang(ev){
 var sv=document.querySelector('#board svg');if(!sv)return null;var r=sv.getBoundingClientRect();
 if(ev.clientX<r.left||ev.clientX>r.right||ev.clientY<r.top||ev.clientY>r.bottom)return null;
 var s=r.width/360,dx=ev.clientX-(r.left+180*s),dy=ev.clientY-(r.top+135*s);
 if(Math.sqrt(dx*dx+dy*dy)<18*s)return null;
 var a=Math.atan2(-dy,dx)*180/Math.PI;return ((Math.round(a/30)*30)%360+360)%360;
}
function startDrag(e,k){
 if(done)return;e.preventDefault();
 var prev=pl[k],moved=false,g=document.createElement('div');
 g.className='ghost';g.textContent=T[k].n;g.style.background=T[k].c;g.style.left=e.clientX+'px';g.style.top=e.clientY+'px';
 document.body.appendChild(g);sel=k;
 function mv(ev){moved=true;g.style.left=ev.clientX+'px';g.style.top=ev.clientY+'px';
  var a=ang(ev);if(a===null){if(prev===undefined)delete pl[k];else pl[k]=prev}else pl[k]=a;upd()}
 function up(ev){window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',up);
  g.remove();
  if(moved){var a=ang(ev);if(a===null){if(prev===undefined)delete pl[k];else pl[k]=prev}else pl[k]=a;sel=null}
  upd()}
 window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
}
function upd(){
 document.getElementById("board").innerHTML=scene(Q[i],done);
 document.querySelectorAll("#pal button").forEach(function(b){var k=b.dataset.k;b.classList.toggle("on",sel==k);b.style.background=sel==k?T[k].c:"";
  b.textContent=(k=="T"&&Q[i].two?"แรงตึงเชือก 1 (T₁)":T[k].n)+(pl[k]!==undefined?" ✓":"")});
 if(sel)document.getElementById("hint").textContent="เลือก "+T[sel].n+" แล้ว แตะทิศที่ต้องการรอบกล่อง";
}
function submit(){
 if(done)return;var q=Q[i],hits=0,rows="";done=true;
 q.ex.forEach(function(e){var ok=pl[e[0]]===e[1];if(ok)hits++;rows+='<li>'+(ok?'✓':'✗')+' '+T[e[0]].n+(ok?'':(pl[e[0]]===undefined?' (ลืมใส่)':' (ทิศไม่ถูก)'))+'</li>'});
 var extra=0;for(var k in pl)if(!q.ex.some(function(e){return e[0]==k}))extra++,rows+='<li>✗ '+T[k].n+' ไม่มีแรงนี้ในสถานการณ์นี้</li>';
 var p=Math.max(0,hits-extra)/q.ex.length;S[i].p=p;S[i].d=true;score=tot();
 var good=p==1;
 document.getElementById("go").classList.add("hide");document.getElementById("clr").classList.add("hide");document.getElementById("pal").classList.add("hide");
 view="key";var hn=document.getElementById("hint");hn.innerHTML='<button class="btn alt" id="tg" style="width:100%"></button>';var tg=document.getElementById("tg");
 function sync(){tg.textContent=view=="key"?"กำลังแสดง: เฉลย ✓ (แตะเพื่อดูคำตอบของฉัน)":"กำลังแสดง: คำตอบของฉัน เส้นประคือผิด (แตะเพื่อดูเฉลย)";upd()}
 tg.onclick=function(){view=view=="key"?"mine":"key";sync()};sync();
 document.getElementById("res").innerHTML='<div class="card fb '+(good?'good':'')+'"><b>'+(good?'ถูกต้องทั้งหมด':'ได้ '+p.toFixed(2)+' คะแนน')+'</b><ul>'+rows+'</ul><p>'+q.why+'</p><button class="btn" id="nx">'+(i==Q.length-1?'ดูผลรวม':'ข้อถัดไป')+'</button></div>';
 document.getElementById("nx").onclick=function(){i++;draw();window.scrollTo(0,0)};
}
start();
